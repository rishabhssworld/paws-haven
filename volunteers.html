<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volunteer — Northern Paws Rescue</title>
  <link rel="stylesheet" href="volunteers.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Northern Paws Rescue logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </header>

  <main>
    <h1>Volunteer with us</h1>

    <div class="columns">
      <section id="roles">
        <h2>What volunteers do</h2>
        <ul>
          <li>Walk the dogs</li>
          <li>Cuddle the cats</li>
          <li class="highlight">Help out on Adoption Day</li>
        </ul>
      </section>

      <section id="why">
        <h2>Why we need you</h2>
        <p>Every walk, cuddle and clean cage means one more animal ready for a home.</p>
      </section>
    </div>

    <section id="signup">
      <h2>Sign up to volunteer</h2>
      <form action="/volunteers" method="post">
        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </p>
        <p>
          <label for="phone">Phone number</label>
          <input type="text" id="phone" name="phone">
        </p>
        <button type="submit">Sign me up</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Northern Paws Rescue, Sudbury, Ontario.</p>
  </footer>
</body>
</html>
