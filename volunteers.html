<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Volunteer — Northern Paws Rescue</title>
</head>
<body>
  <div id="top-bar">
    <img src="images/logo.png">
    <nav>
      <a href="index.html">Home</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </div>

  <main>
    <h1>Volunteer with us</h1>

    <section id="roles">
      <h3>What volunteers do</h3>
      <ul>
        <li><span><div>Walk the dogs</div></span></li>
        <li>Cuddle the cats</li>
        <li>Help out on Adoption Day</li>
      </ul>
    </section>

    <section id="why">
      <h2>Why we need you</h2>
      <p>Every walk, cuddle and clean cage means one more animal ready for a home.</p>
  </main>

  <main>
    <section id="signup">
      <h2>Sign up to volunteer</h2>
      <form action="/volunteers" method="post" id="signup">
        <p>
          <label for="email-address">Email</label>
          <input type="email" id="email" name="email" required>
        </p>
        <p>
          <input type="text" name="phone" placeholder="Phone number">
        </p>
        <button type="submit">Sign me up</button>
      </form>
    </section>
  </main>

  <div id="bottom-bar">
    <p>&copy; 2026 Northern Paws Rescue, Sudbury, Ontario.</p>
  </div>
</body>
</html>
